<head>
<meta charset="utf-8">

<script>
/* ======================= CONFIGURATION CENTER (แก้ไขจุดเดียว) ======================= */
const CONFIG = {
  APP_NAME: "BUENGNIAM SMART LTC",
  APP_NAME_TH: "ระบบบริหารจัดการการดูแลระยะยาว",
  ORGANIZATION: "รพ.สต.บึงเนียม",
  DISTRICT: "อำเภอเมือง",
  PROVINCE: "ขอนแก่น",
  LOGO_TEXT: "BN",                 // ตัวอักษรบนโลโก้ (หรือกำหนด LOGO_URL เป็นรูปภาพ data: URL)
  LOGO_URL: "",
  THEME: "emerald-healthcare",
  FONT: "Kanit",
  GAS_API_URL: "https://script.google.com/macros/s/AKfycby1XcV1WdxW3Nc3gD-GxxaZjLL9mXzLD2NtWyKb_G_V0qnhljXNWXj4icLSz5GmclL8/exec", // URL ของ Web App (…/exec) — เชื่อมต่อ Google Sheets จริง (ไม่ใช่ความลับ ไม่มี API Key)
  DEMO_MODE: true,                 // ใช้ข้อมูลจำลองใน Browser เมื่อยังไม่มี GAS_API_URL
  AI_ENABLED: true,                // แสดงเมนู AI (การเรียก Gemini จริงควบคุมที่ Backend: AI_ENABLED ใน System_Settings)
  NOTIFICATION_ENABLED: true,
  TIMEZONE: "Asia/Bangkok",
  LANGUAGE: "th",
  API_TIMEOUT_MS: 30000,
  COLORS: { primary: "#059669", primaryDark: "#047857", medical: "#0B6BCB", navy: "#0F2A44", orange: "#EA8C0C", purple: "#7C3AED", red: "#DC2626", gray: "#F3F5F8" }
};
</script>
<style>
:root{
  --primary:#059669;--primary-d:#047857;--primary-l:#d1fae5;--medical:#0b6bcb;--medical-l:#dbeafe;--navy:#0f2a44;--navy-2:#163a5c;
  --orange:#ea8c0c;--orange-l:#fef3c7;--purple:#7c3aed;--purple-l:#ede9fe;--red:#dc2626;--red-l:#fee2e2;--gray:#f3f5f8;--gray-2:#e5e9ef;
  --text:#0f172a;--muted:#5b6b7f;--card:#ffffff;--bg:#eef2f6;--line:#dfe5ec;--radius:16px;--shadow:0 1px 2px rgba(15,42,68,.06),0 8px 24px rgba(15,42,68,.06);
  --font:'Kanit',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
html,body{overflow-x:hidden}
body{font-family:var(--font);font-weight:300;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:500;margin:0;line-height:1.3}
a{color:var(--medical)}
.ic,i[data-lucide]{width:18px;height:18px;display:inline-block;vertical-align:-3px;flex:none}
svg.lucide{width:18px;height:18px;vertical-align:-3px;flex:none}
/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy),#0b2036);color:#cfe0f1;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#10b981,#0b6bcb);display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:.5px;box-shadow:0 6px 18px rgba(16,185,129,.35);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;color:#fff;font-weight:500;font-size:14px;letter-spacing:.3px}
.brand small{color:#8fb0cf;font-size:12px}
.nav{padding:6px 10px 20px;flex:1}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:11px;align-items:center;width:100%;padding:9px 12px;margin:2px 0;border-radius:10px;cursor:pointer;color:#c6d7e8;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(16,185,129,.28),rgba(16,185,129,.08));color:#fff;box-shadow:inset 3px 0 0 #34d399}
.nav button:focus-visible{outline:2px solid #34d399}
.side-foot{padding:14px 18px;font-size:12px;color:#7d9bb8;border-top:1px solid rgba(255,255,255,.07)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:22px 24px 90px;max-width:1500px;width:100%}
.iconbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--navy)}
.iconbtn:hover{background:var(--gray)}
.iconbtn:focus-visible{outline:2px solid var(--primary)}
.dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:500}
.mode-pill{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap}
.mode-demo{background:var(--orange-l);color:#9a5b00;border:1px solid #f6c76b}
.mode-prod{background:var(--primary-l);color:var(--primary-d);border:1px solid #6ee7b7}
.api-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#9ca3af;margin-right:5px}
.api-dot.ok{background:#10b981}.api-dot.bad{background:var(--red)}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--gray);cursor:pointer;border:0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px}
.userchip span{font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-banner{background:repeating-linear-gradient(45deg,#fff7e6,#fff7e6 12px,#ffefd1 12px,#ffefd1 24px);color:#8a5200;font-size:13px;padding:6px 24px;border-bottom:1px solid #f6d38b}
/* ---------- cards & widgets ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(223,229,236,.7);padding:18px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid rgba(223,229,236,.7);display:flex;gap:12px;align-items:flex-start}
.kpi .kic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .kv{font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .kl{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.kpi>div:last-child{min-width:0}
.t-green{background:var(--primary-l);color:var(--primary-d)}.t-blue{background:var(--medical-l);color:var(--medical)}.t-orange{background:var(--orange-l);color:#b45309}
.t-purple{background:var(--purple-l);color:var(--purple)}.t-red{background:var(--red-l);color:var(--red)}.t-gray{background:var(--gray);color:var(--muted)}
.chart-box{position:relative;height:260px}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:16px;font-weight:500}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.banner{border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.banner.warn{background:var(--orange-l);color:#7c4a03;border:1px solid #f8d48a}
.banner.info{background:var(--medical-l);color:#0b4a8b;border:1px solid #b6d4fb}
.banner.ai{background:var(--purple-l);color:#4c1d95;border:1px solid #d7c9fb}
.banner.danger{background:var(--red-l);color:#7f1d1d;border:1px solid #fbb}
.page-error{background:var(--red-l);color:#7f1d1d;border-radius:12px;padding:14px}
/* ---------- buttons ---------- */
.btn{border:0;border-radius:11px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:400;background:var(--gray);color:var(--navy);min-height:40px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.25)}
.btn.blue{background:var(--medical);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.purple{background:var(--purple);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.lg{min-height:52px;padding:12px 22px;font-size:16px}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;scrollbar-width:thin}
.tabs button{border:0;background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* ---------- table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar>input,.toolbar>select{width:auto;flex:0 1 210px;min-width:140px}
.toolbar>input[type=search]{flex:1 1 260px}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--gray);color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap;font-size:13px;position:sticky;top:0}
.tbl td{padding:9px 12px;border-top:1px solid var(--gray-2);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7fbff}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:400;white-space:nowrap;background:var(--gray);color:var(--muted)}
.b-green{background:var(--primary-l);color:var(--primary-d)}.b-orange{background:var(--orange-l);color:#a15c00}.b-red{background:var(--red-l);color:#b91c1c}
.b-blue{background:var(--medical-l);color:#0a58a8}.b-purple{background:var(--purple-l);color:var(--purple)}.b-gray{background:var(--gray);color:var(--muted)}
/* ---------- forms ---------- */
input,select,textarea{border:1px solid #cfd8e3;border-radius:10px;padding:8px 11px;background:#fff;min-height:40px;width:100%;outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--primary)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.field.full{grid-column:1/-1}
.field .lbl{color:#334155;font-weight:400}
.field .req{color:var(--red)}
.field .err{color:var(--red);font-size:12px;min-height:0}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red)}
.field.check{flex-direction:row;align-items:center;gap:8px;padding-top:22px}
.form-section{grid-column:1/-1;font-weight:500;color:var(--navy);border-bottom:1px solid var(--line);padding:10px 0 4px;margin-top:4px;display:flex;align-items:center;gap:8px}
.multi{display:flex;flex-wrap:wrap;gap:6px 12px;border:1px solid #cfd8e3;border-radius:10px;padding:8px 10px;background:#fff}
.multi label{display:flex;gap:5px;align-items:center;font-size:13px}
/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,42,68,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:780px;box-shadow:0 30px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.lg{max-width:1100px}.modal.sm{max-width:480px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:17px;flex:1}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 18px}
.kv div{font-size:14px}.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;word-break:break-word}
/* ---------- ADL ---------- */
.adl-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.adl-item h4{font-size:15px;margin-bottom:6px}
.adl-opt{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:10px;cursor:pointer;font-size:14px}
.adl-opt:hover{background:var(--gray)}
.adl-opt.sel{background:var(--primary-l)}
.adl-opt b{min-width:22px;font-weight:500;color:var(--primary-d)}
.sticky-sum{position:sticky;top:70px;z-index:5}
.score-big{font-size:44px;font-weight:500;line-height:1}
/* ---------- patient header ---------- */
.p-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.p-avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--medical));color:#fff;display:grid;place-items:center;font-size:22px}
/* ---------- wizard ---------- */
.steps{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.steps span{flex:1;min-width:84px;text-align:center;padding:7px 6px;border-radius:10px;background:var(--gray);font-size:12.5px;color:var(--muted)}
.steps span.on{background:var(--primary);color:#fff}.steps span.done{background:var(--primary-l);color:var(--primary-d)}
/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center}
.cal .d{min-height:86px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;font-size:12px;cursor:pointer;overflow:hidden}
.cal .d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal .d.out{opacity:.4}
.cal .ev{display:block;border-radius:6px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-hero{background:radial-gradient(1200px 600px at 10% 10%,rgba(16,185,129,.35),transparent 60%),radial-gradient(900px 500px at 90% 90%,rgba(11,107,203,.35),transparent 60%),var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login-hero h1{font-size:34px;font-weight:500;margin:22px 0 10px}
.login-hero p{color:#bcd3ea;max-width:520px}
.login-hero .motto{letter-spacing:2px;font-size:12px;color:#7ee2b8}
.login-card{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login-box{width:100%;max-width:400px}
.login-box h2{font-size:24px;margin-bottom:6px}
.feature{display:flex;gap:10px;align-items:center;color:#d6e6f5;font-size:14px;margin:8px 0}
/* ---------- mobile ---------- */
.bottom-nav{display:none}
.drawer-bg{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:200;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150}
  .menu-toggle{display:grid!important}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{all:unset;flex:1;text-align:center;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  .bottom-nav button.on{color:var(--primary)}
  .content{padding:16px 16px 96px}
  .topbar{padding:10px 16px}
  .login-wrap{grid-template-columns:1fr}
  .login-hero{padding:28px 20px}
  .login-hero h1{font-size:24px}
  .userchip span:not(.avatar){display:none}
  .userchip{padding:4px}
}
@media (max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px}.kpi .kv{font-size:20px}.kpi .kic{display:none}
  .form-grid{grid-template-columns:1fr}
  .modal-bg{padding:0}.modal{border-radius:0;max-height:100vh;min-height:100vh}
  .toolbar>*{flex:1 1 100%}
  .hide-sm{display:none}
  .mode-pill{display:none}
}
.menu-toggle{display:none!important}
/* ---------- print ---------- */
@media print{.sidebar,.topbar,.bottom-nav,.demo-banner,.no-print{display:none!important}.shell{display:block}.content{padding:0}.card{box-shadow:none;border:0}}
.leaflet-container{border-radius:14px;height:460px;font-family:var(--font)}
.errlist{text-align:left;font-size:14px}
.swal2-popup{font-family:var(--font)!important}
</style>
</head>
<body>
<div id="app"><div style="display:grid;place-items:center;min-height:100vh;color:#5b6b7f">กำลังโหลดระบบ…</div></div>
<pre id="selftest-result" hidden></pre>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
